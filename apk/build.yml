name: Build APK from game zip

# วิธีใช้: ใส่ไฟล์ zip ของเกม (เช่น Zhess-X-v6_1.zip) ไว้ที่ราก repo พร้อมไฟล์นี้
# แก้ลิงก์เซิร์ฟเวอร์ด้านล่างเป็นลิงก์ Render ของคุณ แล้ว commit -> Actions จะสร้าง APK ให้เอง
on:
  push:
  workflow_dispatch:

env:
  SERVER_URL: "https://YOUR-GAME.onrender.com"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unpack game zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | sort -V | tail -1)
          if [ -z "$ZIP" ]; then echo "ไม่พบไฟล์ .zip ของเกมที่ราก repo"; exit 1; fi
          echo "ใช้ไฟล์: $ZIP"
          rm -rf _game && mkdir _game && unzip -q "$ZIP" -d _game
          IDX=$(find _game -name index.html | head -1)
          if [ -z "$IDX" ]; then echo "ไม่พบ index.html ใน zip"; exit 1; fi
          echo "GAME_DIR=$(dirname "$IDX")" >> "$GITHUB_ENV"

      - name: Create Android project
        run: |
          mkdir -p _app
          cat > _app/settings.gradle <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZhessX"
          include ':app'
          EOF_0
          cat > _app/build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_1
          cat > _app/gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_2
          mkdir -p _app/app
          cat > _app/app/build.gradle <<'EOF_3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zhessx.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.zhessx.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release { minifyEnabled false }
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF_3
          mkdir -p _app/app/src/main/res/values
          cat > _app/app/src/main/res/values/strings.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zhess X</string>
              <string name="press_back_again">กดย้อนกลับอีกครั้งเพื่อออกจากเกม</string>
          </resources>
          EOF_4
          mkdir -p _app/app/src/main/res/values
          cat > _app/app/src/main/res/values/styles.xml <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="GameTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">false</item>
              </style>
          </resources>
          EOF_5
          mkdir -p _app/app/src/main
          cat > _app/app/src/main/AndroidManifest.xml <<'EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/GameTheme"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_6
          mkdir -p _app/app/src/main/java/com/zhessx/app
          cat > _app/app/src/main/java/com/zhessx/app/MainActivity.java <<'EOF_7'
          package com.zhessx.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.content.res.AssetManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.webkit.WebViewAssetLoader;

          import java.io.IOException;
          import java.io.InputStream;
          import java.util.Locale;

          public class MainActivity extends Activity {

              // The game files are bundled inside the APK (assets/www) and served from this https origin.
              private static final String START_URL = "https://appassets.androidplatform.net/assets/www/index.html";

              private WebView web;
              private long lastBack = 0;

              /** Serves files from assets with explicit MIME types (SVG etc.). */
              private static class AssetHandler implements WebViewAssetLoader.PathHandler {
                  private final AssetManager am;
                  AssetHandler(AssetManager am) { this.am = am; }

                  @Override
                  public WebResourceResponse handle(String path) {
                      try {
                          InputStream in = am.open(path);
                          return new WebResourceResponse(mime(path), null, in);
                      } catch (IOException e) {
                          return null;
                      }
                  }

                  private static String mime(String p) {
                      p = p.toLowerCase(Locale.ROOT);
                      if (p.endsWith(".html")) return "text/html";
                      if (p.endsWith(".js")) return "application/javascript";
                      if (p.endsWith(".css")) return "text/css";
                      if (p.endsWith(".json")) return "application/json";
                      if (p.endsWith(".svg")) return "image/svg+xml";
                      if (p.endsWith(".png")) return "image/png";
                      if (p.endsWith(".jpg") || p.endsWith(".jpeg")) return "image/jpeg";
                      if (p.endsWith(".webp")) return "image/webp";
                      if (p.endsWith(".gif")) return "image/gif";
                      if (p.endsWith(".mp3")) return "audio/mpeg";
                      if (p.endsWith(".ogg")) return "audio/ogg";
                      if (p.endsWith(".wav")) return "audio/wav";
                      if (p.endsWith(".woff2")) return "font/woff2";
                      if (p.endsWith(".woff")) return "font/woff";
                      return "application/octet-stream";
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new AssetHandler(getAssets()))
                          .build();

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF0A0F1C);

                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setAllowFileAccess(false);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setBackgroundColor(0xFF0A0F1C);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if ("appassets.androidplatform.net".equals(u.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                          return true;
                      }
                  });

                  root.addView(web, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  if (savedInstanceState != null) web.restoreState(savedInstanceState);
                  else web.loadUrl(START_URL);
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              @Override protected void onResume() { super.onResume(); web.onResume(); hideBars(); }
              @Override protected void onPause() { web.onPause(); super.onPause(); }

              @Override
              public void onBackPressed() {
                  long now = System.currentTimeMillis();
                  if (now - lastBack < 2000) {
                      super.onBackPressed();
                  } else {
                      lastBack = now;
                      Toast.makeText(this, R.string.press_back_again, Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              protected void onDestroy() {
                  web.destroy();
                  super.onDestroy();
              }
          }
          EOF_7
          ICON=$(find "$GAME_DIR" -name icon-192.png | head -1)
          if [ -z "$ICON" ]; then echo "ไม่พบ icon-192.png ในเกม"; exit 1; fi
          mkdir -p _app/app/src/main/res/mipmap-xxxhdpi
          cp "$ICON" _app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Bundle and patch game
        run: |
          python3 - <<'PYEOF'
          import os, shutil, sys

          src = os.environ["GAME_DIR"]
          dst = os.path.join("_app", "app", "src", "main", "assets", "www")
          url = os.environ.get("SERVER_URL", "").strip().rstrip("/")
          if "YOUR-GAME" in url or not url.startswith("http"):
              print("WARNING: SERVER_URL in build.yml is not set - bot mode works, online mode will not connect.")

          if os.path.isdir(dst):
              shutil.rmtree(dst)
          shutil.copytree(src, dst)

          # Units: rebuild the one-file bundle from data/units/*.js (the web server does the same on every start).
          udir = os.path.join(dst, "data", "units")
          if os.path.isdir(udir):
              names = sorted(f for f in os.listdir(udir) if f.endswith(".js"))
              parts = ["// " + f + "\n" + open(os.path.join(udir, f), encoding="utf-8").read() for f in names]
              open(os.path.join(dst, "data", "units.bundle.js"), "w", encoding="utf-8").write("\n".join(parts))
              print("units bundled:", len(names))

          def patch(rel, edits):
              path = os.path.join(dst, rel)
              b = open(path, "rb").read()
              for old, new, required in edits:
                  old, new = old.encode("utf-8"), new.encode("utf-8")
                  n = b.count(old)
                  if n != 1:
                      if required:
                          sys.exit("PATCH FAILED in %s (found %d times): %s" % (rel, n, old[:70]))
                      print("skip (not found):", old[:50])
                      continue
                  b = b.replace(old, new)
              open(path, "wb").write(b)

          # index.html: socket.io is no longer a static script (the server address is injected), no red error bar for it, no service worker
          # index.html: tell the game where the server is (the same game files also run on the web, where this is empty); no service worker in the app
          patch("index.html", [
              ('window.ZHESS_SERVER="";', 'window.ZHESS_APP=true;window.ZHESS_SERVER=%s;' % repr(url).replace("'", '"'), True),
              ('<script>if("serviceWorker"in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>', '', False),
          ])
          print("assets ready, server =", url)
          PYEOF

      - name: Build APK
        run: gradle -p _app assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ZhessX-apk
          path: _app/app/build/outputs/apk/debug/app-debug.apk
