<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zhess X - What's New</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 28% 0,#263653 0,#111827 55%,#0b0e15 100%);color:#eef3ff;font-family:system-ui,sans-serif;min-height:100vh}
  main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:28px;letter-spacing:.06em;margin:0 0 4px}
  .sub{color:#8998b2;margin:0 0 20px}
  a.play{display:inline-block;margin-bottom:22px;padding:10px 22px;border:1px solid #c9a96a;color:#fff;text-decoration:none;font-weight:800;letter-spacing:.06em;background:#171f30}
  .card{background:#171f30;border:1px solid #3b4b69;border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .card h2{margin:0 0 4px;font-size:17px}
  .card small{color:#8998b2}
  .card .note{margin:6px 0;color:#c9d4e8}
  .card ul{margin:8px 0 0;padding-left:20px;color:#dfe8f7;line-height:1.55}
  .tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:#35a8ff;color:#071321;font-size:11px;font-weight:800;vertical-align:middle}
  .empty{color:#8998b2;text-align:center;padding:20px}
</style>
</head>
<body>
<main>
  <h1>What's New</h1>
  <p class="sub">รายการอัปเดตตัวละครและสกิลของ Zhess X (สร้างอัตโนมัติจากไฟล์ที่อัปโหลด)</p>
  <a class="play" href="/">เล่นเกม</a>
  <div id="list"><div class="empty">กำลังโหลด...</div></div>
</main>
<script>
function card(title,meta,note,changes,tag){
  var d=document.createElement("div");d.className="card";
  var h=document.createElement("h2");h.textContent=title;
  if(tag){var t=document.createElement("span");t.className="tag";t.textContent=tag;h.appendChild(t)}
  d.appendChild(h);
  if(meta){var s=document.createElement("small");s.textContent=meta;d.appendChild(s)}
  if(note){var p=document.createElement("div");p.className="note";p.textContent=note;d.appendChild(p)}
  var ul=document.createElement("ul");
  (changes||[]).forEach(function(c){var li=document.createElement("li");li.textContent=c;ul.appendChild(li)});
  d.appendChild(ul);return d;
}
fetch("/api/whatsnew",{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
  var box=document.getElementById("list");box.innerHTML="";
  if(j.pending&&j.pending.changes&&j.pending.changes.length)
    box.appendChild(card("อัปเดตล่าสุด","","",j.pending.changes,"ใหม่"));
  (j.history||[]).forEach(function(e){
    box.appendChild(card("เวอร์ชัน "+(e.version||"-"),e.date||"",e.note||"",e.changes));
  });
  if(!box.children.length){var m=document.createElement("div");m.className="empty";m.textContent="ยังไม่มีรายการอัปเดต";box.appendChild(m)}
}).catch(function(){document.getElementById("list").innerHTML='<div class="empty">โหลดรายการไม่สำเร็จ</div>'});
</script>
</body>
</html>
